name: Workflow Deploy

# Caminho de entrega: um push em `homolog` ou `production` leva a aplicação ao ambiente de
# mesmo nome sem nenhum passo manual. Testa, constrói a imagem, publica no ECR com a
# identificação do commit, entrega os segredos, aplica o overlay do ambiente em
# k8s/overlays/, espera o rollout convergir e fecha com o smoke test contra o endereço
# público.
#
# A `main` é só integração: ela roda o CI (ci.yml) e não implanta nada. A promoção é o
# merge da `main` em `homolog` e, depois, em `production`.
#
# Os ambientes dividem um cluster EKS (repositório oficina-infra-k8s) e são isolados por
# namespace e por um RDS próprio cada (oficina-infra-db). O nome da branch é o nome do
# namespace e do GitHub Environment, de onde saem os secrets do ambiente.
#
# Os três jobs são encadeados por `needs`, então uma etapa que falha interrompe a
# entrega: teste vermelho não gera imagem, e imagem que não publicou não chega ao
# cluster.
#
# As migrations não têm passo próprio: `flyway.migrate-at-start` as aplica na
# inicialização do pod, e por isso quem as espera é o `rollout status` — um pod só fica
# pronto depois de migrar o banco (ADR-0003). Quem afirma que elas rodaram é o smoke test,
# que escreve no banco: schema atrás da imagem reprova a entrega ali.
#
# O provisionamento da infraestrutura não está aqui: cluster e banco têm repositório e
# pipeline próprios (oficina-infra-k8s e oficina-infra-db).

on:
  push:
    branches: [homolog, production]
    # Merge só de documentação não muda imagem nem manifesto: não há o que entregar, e
    # gastar a sessão do lab nele é o que faria o caminho de entrega parecer instável.
    paths-ignore:
      - "**/*.md"
  # O disparo manual reentrega o commit que já está na branch escolhida — é o caminho de
  # voltar ao ar depois de um reset do lab ou de uma troca de segredo, sem commit vazio.
  workflow_dispatch:

permissions:
  contents: read

# Duas entregas ao mesmo ambiente disputariam o mesmo Deployment, e a segunda veria o
# rollout da primeira. Ambientes diferentes não se atrapalham. Sem cancelamento:
# interromper no meio deixaria o cluster com a imagem nova e os segredos antigos.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY_NAME: oficina-app

jobs:

  # ── 1. Gate de qualidade: build e testes da aplicação ────────────────────────
  #
  # `verify` é o gate inteiro num comando: compila, roda os testes unitários, Checkstyle,
  # PMD, SpotBugs, Spotless e o mínimo de cobertura do JaCoCo. Teste vermelho para a
  # entrega aqui, antes de existir imagem.
  #
  # O job não reusa o workflow de build compartilhado que o ci.yml chama: ele vive num
  # repositório privado da organização cujo acesso não está liberado para este repo, e
  # `uses` de workflow inacessível reprova a execução antes de qualquer job começar. O
  # caminho de entrega não pode depender disso.
  build:
    name: Build & Tests (Quarkus JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # O disparo manual aceita qualquer branch, e só duas têm ambiente. Falhar aqui, em
      # segundos, custa menos que descobrir no job de deploy que o Environment não existe.
      - name: Confere o ambiente
        env:
          ENVIRONMENT: ${{ github.ref_name }}
        run: |
          if [[ "$ENVIRONMENT" != "homolog" && "$ENVIRONMENT" != "production" ]]; then
            echo "A entrega só vale para as branches homolog e production; recebeu '$ENVIRONMENT'." >&2
            exit 1
          fi

      - name: Instala o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Build, testes e gates de qualidade
        run: ./mvnw --batch-mode verify

  # Resolve apenas saídas não secretas dos states existentes. O state fica no runner e
  # nunca é enviado a artifacts, summaries ou outputs do workflow.
  resolve_config:
    name: Resolve configuração (${{ github.ref_name }})
    needs: [build]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    outputs:
      account_id: ${{ steps.outputs.outputs.account_id }}
      cluster_name: ${{ steps.outputs.outputs.cluster_name }}
      db_address: ${{ steps.outputs.outputs.db_address }}
      db_port: ${{ steps.outputs.outputs.db_port }}
      db_name: ${{ steps.outputs.outputs.db_name }}
      gateway_url: ${{ steps.outputs.outputs.gateway_url }}
      jwt_issuer: ${{ steps.outputs.outputs.jwt_issuer }}
      tf_state_bucket: ${{ steps.outputs.outputs.tf_state_bucket }}
      aws_region: ${{ steps.outputs.outputs.aws_region }}
    env:
      AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_ACCESS_KEY_ID || github.ref_name == 'production' && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY || github.ref_name == 'production' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      AWS_SESSION_TOKEN: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SESSION_TOKEN || github.ref_name == 'production' && secrets.AWS_SESSION_TOKEN || '' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ENVIRONMENT: ${{ github.ref_name }}
      JWT_ISSUER: ${{ vars.JWT_ISSUER || 'oficina-api' }}
    steps:
      - name: Confere credenciais e bucket
        run: |
          [[ -n "$TF_STATE_BUCKET" ]] || { echo "Variable TF_STATE_BUCKET ausente." >&2; exit 1; }
          aws sts get-caller-identity >/dev/null

      - name: Resolve outputs Terraform
        id: outputs
        run: |
          state_dir="$(mktemp -d)"
          trap 'rm -rf "$state_dir"' EXIT
          aws s3 cp "s3://$TF_STATE_BUCKET/oficina-infra-db/$ENVIRONMENT/terraform.tfstate" "$state_dir/db.tfstate" --only-show-errors
          aws s3 cp "s3://$TF_STATE_BUCKET/oficina-infra-k8s/terraform.tfstate" "$state_dir/k8s.tfstate" --only-show-errors
          read_output() {
            local state="$1" name="$2" value
            value="$(jq -er --arg name "$name" '.outputs[$name].value | select(. != null and . != "")' "$state")" || {
              echo "Output Terraform '$name' ausente no state esperado." >&2
              exit 1
            }
            printf '%s' "$value"
          }
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          cluster_name="$(read_output "$state_dir/k8s.tfstate" cluster_name)"
          db_address="$(read_output "$state_dir/db.tfstate" db_address)"
          db_port="$(read_output "$state_dir/db.tfstate" db_port)"
          db_name="$(read_output "$state_dir/db.tfstate" db_name)"
          gateway_url="$(jq -er --arg env "$ENVIRONMENT" '.outputs.api_gateway_urls.value[$env]' "$state_dir/k8s.tfstate")"
          for pair in account_id cluster_name db_address db_port db_name gateway_url; do
            printf '%s=%s\n' "$pair" "${!pair}" >> "$GITHUB_OUTPUT"
          done
          printf 'jwt_issuer=%s\n' "$JWT_ISSUER" >> "$GITHUB_OUTPUT"
          printf 'tf_state_bucket=%s\n' "$TF_STATE_BUCKET" >> "$GITHUB_OUTPUT"
          printf 'aws_region=%s\n' "$AWS_REGION" >> "$GITHUB_OUTPUT"

  # ── 2. Imagem no registry, identificada pelo commit ──────────────────────────
  #
  # É o único job que usa credencial da AWS, e por isso está separado do deploy: a sessão
  # do Learner Lab expira em cerca de quatro horas, e o acesso ao cluster não pode
  # depender dela (ADR-0002).
  image:
    name: Imagem no ECR
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name }}
    outputs:
      repository_url: ${{ steps.registry.outputs.repository_url }}
    env:
      AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_ACCESS_KEY_ID || github.ref_name == 'production' && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY || github.ref_name == 'production' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      AWS_SESSION_TOKEN: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SESSION_TOKEN || github.ref_name == 'production' && secrets.AWS_SESSION_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4

      # Sessão do lab vencida é o modo de falha mais comum deste job. Falhar em segundos
      # custa menos que descobrir isso no meio do push da imagem.
      - name: Confere a sessão do lab
        run: aws sts get-caller-identity

      # O repositório pertence ao oficina-infra-k8s e o endereço dele carrega o ID da conta,
      # que muda entre sessões do Learner Lab. Perguntar à AWS é o que garante que a imagem
      # publicada e a imagem aplicada no cluster são a mesma, sem um segundo lugar para
      # manter em dia.
      - name: Descobre o repositório de imagem
        id: registry
        run: |
          repository_url="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --query 'repositories[0].repositoryUri' --output text)"
          echo "repository_url=$repository_url" >> "$GITHUB_OUTPUT"
          echo "Repositório: $repository_url"

      - name: Prepara o buildx
        uses: docker/setup-buildx-action@v3

      - name: Constrói e publica a imagem
        env:
          ECR_REPOSITORY_URL: ${{ steps.registry.outputs.repository_url }}
        run: bash infra/scripts/publish-image.sh "$GITHUB_SHA"

  # ── 3. Entrega no cluster ────────────────────────────────────────────────────
  #
  # Nenhuma credencial da AWS aqui: o acesso é o token da ServiceAccount github-deployer
  # do namespace do ambiente, criada por infra/scripts/create-deploy-kubeconfig.sh
  # (ADR-0002). Como cada namespace tem a sua, o token de homologação não alcança produção.
  #
  # `environment` é o que faz `secrets.*` resolver para os valores do ambiente da branch.
  deploy:
    name: Deploy no cluster (${{ github.ref_name }})
    needs: [image, resolve_config]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name }}
    outputs:
      upstream_url: ${{ steps.upstream.outputs.url }}
    env:
      NAMESPACE: ${{ github.ref_name }}
      # Acompanha o `kubernetes_version` do cluster em oficina-infra-k8s/variables.tf.
      KUBERNETES_VERSION: "1.34.1"
      KUSTOMIZE_VERSION: "5.7.1"
      IMAGE_TAG: ${{ github.sha }}
      ECR_REPOSITORY_URL: ${{ needs.image.outputs.repository_url }}
      INFRA_HOST_POSTGRES: ${{ needs.resolve_config.outputs.db_address }}
      POSTGRES_PORT: ${{ needs.resolve_config.outputs.db_port }}
      POSTGRES_DB: ${{ needs.resolve_config.outputs.db_name }}
      APP_PUBLIC_BASE_URL: ${{ needs.resolve_config.outputs.gateway_url }}
      JWT_ISSUER: ${{ needs.resolve_config.outputs.jwt_issuer }}
    steps:
      - uses: actions/checkout@v4

      - name: Instala o kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v${{ env.KUBERNETES_VERSION }}

      # `kubectl apply -k` aplica o kustomization, mas não escreve nele: trocar a tag da
      # imagem pede o CLI do kustomize.
      - name: Instala o kustomize
        run: |
          curl -fsSL \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv$KUSTOMIZE_VERSION/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          kustomize version

      # O kubeconfig vai para um arquivo fora da árvore do repositório, com permissão
      # restrita: ele carrega o token de acesso ao cluster.
      - name: Autentica no cluster
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [[ -z "$KUBE_CONFIG_B64" ]]; then
            echo "O secret KUBE_CONFIG_B64 não está definido no Environment $NAMESPACE." >&2
            echo "Gere o acesso da pipeline com: infra/scripts/create-deploy-kubeconfig.sh $NAMESPACE" >&2
            exit 1
          fi
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          (umask 077 && base64 --decode <<<"$KUBE_CONFIG_B64" >"$kubeconfig")
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Confere o acesso ao cluster
        run: kubectl get deploy --namespace "$NAMESPACE"

      # Os dois Secrets não estão em k8s/ de propósito — senha do banco, credenciais de
      # seed e chave privada RS256 não entram no repositório. Eles são montados aqui a
      # partir dos secrets do Environment, e o script não imprime nenhum dos valores.
      - name: Entrega os segredos ao cluster
        env:
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
          APP_SEED_MECHANIC_PASSWORD: ${{ secrets.APP_SEED_MECHANIC_PASSWORD }}
          JWT_PRIVATE_KEY_B64: ${{ secrets.JWT_PRIVATE_KEY_B64 }}
          JWT_PUBLIC_KEY_B64: ${{ secrets.JWT_PUBLIC_KEY_B64 }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: bash infra/scripts/create-app-credentials.sh

      # A tag do commit é o que faz do apply um rollout de verdade: com `latest`, o objeto
      # no cluster não muda e o Kubernetes não substitui pod algum.
      #
      # Reentregar o mesmo commit — um disparo manual depois de trocar um segredo — cai
      # justamente nesse caso: o Deployment já está na imagem alvo, o apply não muda nada,
      # e os pods continuariam com os segredos antigos. O restart é o que faz a reentrega
      # significar a mesma coisa que a primeira.
      - name: Aplica os manifestos
        run: |
          bash infra/scripts/render-deploy-configmap.sh > k8s/overlays/$NAMESPACE/configmap-patch.yaml
          overlay="$GITHUB_WORKSPACE/k8s/overlays/$NAMESPACE"
          trap 'rm -f "$overlay/configmap-patch.yaml" "$overlay/servicemonitor.yaml"; git checkout -- "$overlay/kustomization.yaml"' EXIT
          cat >> k8s/overlays/$NAMESPACE/kustomization.yaml <<'KUSTOMIZATION'
          patches:
            - path: configmap-patch.yaml
          KUSTOMIZATION
          cd "$overlay"
          deployed_image="$(kubectl get deploy/oficina-mecanica --namespace "$NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          kustomize edit set image "oficina-mecanica=$ECR_REPOSITORY_URL:$IMAGE_TAG"
          if kubectl api-versions | grep -Fxq 'monitoring.coreos.com/v1'; then
            # O Kustomize só carrega arquivos dentro da raiz do overlay.
            cp ../../base/servicemonitor.yaml ./servicemonitor.yaml
            kustomize edit add resource servicemonitor.yaml
          else
            echo "CRD ServiceMonitor ausente; adiando a métrica do Prometheus até o stack ser instalado."
          fi
          kubectl apply -k .
          if [[ "$deployed_image" == "$ECR_REPOSITORY_URL:$IMAGE_TAG" ]]; then
            echo "O cluster já roda esta imagem; reiniciando para os pods lerem os segredos atuais."
            kubectl rollout restart deploy/oficina-mecanica --namespace "$NAMESPACE"
          fi

      # Só depois disto a entrega pode ser declarada boa: o pod novo passou pelas probes,
      # o que inclui migrar o banco e conectar no RDS.
      - name: Aguarda o rollout
        run: kubectl rollout status deploy/oficina-mecanica --namespace "$NAMESPACE" --timeout=10m

      - name: Descobre o NLB interno após readiness
        id: upstream
        run: |
          hostname="$(kubectl get svc oficina-mecanica-gateway --namespace "$NAMESPACE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          [[ -n "$hostname" ]] || { echo "Service interno sem hostname de NLB após readiness." >&2; exit 1; }
          echo "url=http://$hostname" >> "$GITHUB_OUTPUT"

      - name: Diagnóstico da falha
        if: failure()
        run: |
          kubectl get pods --namespace "$NAMESPACE" -o wide || true
          kubectl describe deploy/oficina-mecanica --namespace "$NAMESPACE" || true
          kubectl logs --namespace "$NAMESPACE" -l app.kubernetes.io/name=oficina-mecanica --tail=100 --all-containers || true

  publish_upstream:
    name: Publica contrato upstream
    needs: [deploy, resolve_config]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_ACCESS_KEY_ID || github.ref_name == 'production' && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY || github.ref_name == 'production' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      AWS_SESSION_TOKEN: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SESSION_TOKEN || github.ref_name == 'production' && secrets.AWS_SESSION_TOKEN || '' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      UPSTREAM_URL: ${{ needs.deploy.outputs.upstream_url }}
      ACCOUNT_ID: ${{ needs.resolve_config.outputs.account_id }}
      CLUSTER_NAME: ${{ needs.resolve_config.outputs.cluster_name }}
      ENVIRONMENT: ${{ github.ref_name }}
    steps:
      - name: Publica contrato versionado sem segredos
        run: |
          [[ -n "$UPSTREAM_URL" && -n "$TF_STATE_BUCKET" ]] || { echo "URL upstream ou TF_STATE_BUCKET ausente." >&2; exit 1; }
          hostname="${UPSTREAM_URL#http://}"
          load_balancer_arn="$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?DNSName=='${hostname}'].LoadBalancerArn | [0]" --output text)"
          [[ "$load_balancer_arn" =~ ^arn:[^:]+:elasticloadbalancing: ]] || {
            echo "Não foi possível resolver o NLB interno pelo hostname do Service." >&2
            exit 1
          }
          listener_arn="$(aws elbv2 describe-listeners --load-balancer-arn "$load_balancer_arn" \
            --query 'Listeners[?Port==`80`].ListenerArn | [0]' --output text)"
          [[ "$listener_arn" =~ ^arn:[^:]+:elasticloadbalancing: ]] || {
            echo "Listener HTTP 80 ausente no NLB interno." >&2
            exit 1
          }
          target_group_arn="$(aws elbv2 describe-target-groups --load-balancer-arn "$load_balancer_arn" \
            --query 'TargetGroups[0].TargetGroupArn' --output text)"
          healthy_targets="$(aws elbv2 describe-target-health --target-group-arn "$target_group_arn" \
            --query 'length(TargetHealthDescriptions[?TargetHealth.State==`healthy`])' --output text)"
          [[ "$healthy_targets" =~ ^[1-9][0-9]*$ ]] || {
            echo "O NLB interno ainda não tem target saudável." >&2
            exit 1
          }
          contract="$(jq -n \
            --arg account_id "$ACCOUNT_ID" --arg region "$AWS_REGION" \
            --arg environment "$ENVIRONMENT" --arg cluster_name "$CLUSTER_NAME" \
            --arg upstream_url "$UPSTREAM_URL" --arg listener_arn "$listener_arn" \
            --arg source_sha "$GITHUB_SHA" \
            '{contract_version:1,account_id:$account_id,region:$region,environment:$environment,cluster_name:$cluster_name,upstream_url:$upstream_url,integration_listener_arn:$listener_arn,source_sha:$source_sha}')"
          printf '%s\n' "$contract" > "$RUNNER_TEMP/upstream.json"
          aws s3 cp "$RUNNER_TEMP/upstream.json" \
            "s3://$TF_STATE_BUCKET/oficina/config/v1/$ENVIRONMENT/upstream.json" --content-type application/json --only-show-errors

  reconcile_gateway:
    name: Reconcilia API Gateway (${{ github.ref_name }})
    needs: [publish_upstream, resolve_config]
    uses: 15SOAT-JVGG/oficina-infra-k8s/.github/workflows/reconcile.yml@68b96a266956f12ad67e96de869b54e0ef4c059d
    with:
      environment: ${{ github.ref_name }}
      source_kind: app
      source_sha: ${{ github.sha }}
      infra_ref: 68b96a266956f12ad67e96de869b54e0ef4c059d
      aws_region: ${{ needs.resolve_config.outputs.aws_region }}
      tf_state_bucket: ${{ needs.resolve_config.outputs.tf_state_bucket }}
      jwt_issuer: ${{ vars.JWT_ISSUER || 'oficina-api' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'production' && secrets.AWS_ACCESS_KEY_ID || '' }}
      AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'production' && secrets.AWS_SECRET_ACCESS_KEY || '' }}
      AWS_SESSION_TOKEN: ${{ github.ref_name == 'production' && secrets.AWS_SESSION_TOKEN || '' }}
      HOMOLOG_AWS_ACCESS_KEY_ID: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_ACCESS_KEY_ID || '' }}
      HOMOLOG_AWS_SECRET_ACCESS_KEY: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SECRET_ACCESS_KEY || '' }}
      HOMOLOG_AWS_SESSION_TOKEN: ${{ github.ref_name == 'homolog' && secrets.HOMOLOG_AWS_SESSION_TOKEN || '' }}
      AUTHORIZER_TEST_CUSTOMER_CPF: ${{ secrets.AUTHORIZER_TEST_CUSTOMER_CPF }}

  retire_public_origin:
    name: Remove o ELB público legado após a reconciliação privada
    needs: [deploy, reconcile_gateway, smoke_test]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      NAMESPACE: ${{ github.ref_name }}
      KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
    steps:
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Remove o Service público legado depois do Gateway
        run: |
          [[ -n "$KUBE_CONFIG_B64" ]] || { echo "KUBE_CONFIG_B64 ausente em $NAMESPACE." >&2; exit 1; }
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          (umask 077 && base64 --decode <<<"$KUBE_CONFIG_B64" >"$kubeconfig")
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          export KUBECONFIG="$kubeconfig"
          if ! kubectl get service oficina-mecanica --namespace "$NAMESPACE" >/dev/null 2>&1; then
            echo "O Service legado já não existe em $NAMESPACE."
            exit 0
          fi

          kubectl patch service oficina-mecanica --namespace "$NAMESPACE" \
            --type merge --patch '{"spec":{"type":"ClusterIP"}}'

          for attempt in $(seq 1 60); do
            service_type="$(kubectl get service oficina-mecanica --namespace "$NAMESPACE" \
              -o jsonpath='{.spec.type}')"
            public_hostname="$(kubectl get service oficina-mecanica --namespace "$NAMESPACE" \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [[ "$service_type" == "ClusterIP" && -z "$public_hostname" ]]; then
              echo "Service legado em ClusterIP e sem hostname público."
              exit 0
            fi
            sleep 10
          done

          echo "O Service mudou para ClusterIP, mas o hostname do ELB ainda aparece no status." >&2
          exit 1
  smoke_test:
    name: Smoke test via API Gateway (${{ github.ref_name }})
    needs: [deploy, resolve_config, reconcile_gateway]
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
      APP_PUBLIC_BASE_URL: ${{ needs.resolve_config.outputs.gateway_url }}
      UPSTREAM_URL: ${{ needs.deploy.outputs.upstream_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test pelo Gateway
        run: bash infra/scripts/smoke-test.sh "$APP_PUBLIC_BASE_URL"

      - name: Confere ELB diretamente para diagnóstico
        env:
          APP_SEED_ADMIN_PASSWORD: ${{ secrets.APP_SEED_ADMIN_PASSWORD }}
          APP_SEED_ADMIN_USERNAME: ${{ vars.APP_SEED_ADMIN_USERNAME || 'admin' }}
        if: always()
        continue-on-error: true
        run: |
          payload="$(jq -nc --arg username "$APP_SEED_ADMIN_USERNAME" --arg password "$APP_SEED_ADMIN_PASSWORD" '{username:$username,password:$password}')"
          status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data "$payload" \
            "$UPSTREAM_URL/v1/auth/login")"
          [[ "$status" == "200" ]] || { echo "Login direto no ELB devolveu $status." >&2; exit 1; }

  public_docs_smoke_test:
    name: OpenAPI e Swagger públicos via Gateway
    needs: [deploy, resolve_config, reconcile_gateway]
    if: >-
      always() && needs.deploy.result == 'success' && needs.resolve_config.result == 'success'
    runs-on: ubuntu-latest
    env:
      APP_PUBLIC_BASE_URL: ${{ needs.resolve_config.outputs.gateway_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verifica OpenAPI e Swagger sem credenciais
        run: bash infra/scripts/public-docs-smoke-test.sh "$APP_PUBLIC_BASE_URL"
