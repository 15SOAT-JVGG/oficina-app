events {}
http {
    server {
        listen 8080;
        # Estoque é bloqueado pelo OS após autorização, evitando responder 503 antes do RBAC.
        location = /admin/parts/low-stock { proxy_pass http://app:8080; }
        location ~ ^/admin/parts/[^/]+/stock$ { proxy_pass http://app:8080; }
        location = /admin/parts { proxy_pass http://billing:8080; }
        location /admin/parts/ { proxy_pass http://billing:8080; }
        location = /admin/services { proxy_pass http://billing:8080; }
        location /admin/services/ { proxy_pass http://billing:8080; }
        location / { proxy_pass http://app:8080; }
    }
}
