apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-mecanica-config
data:
  # O listener de gerenciamento tem Service ClusterIP separado; o Service público
  # continua encaminhando somente a porta HTTP 8080.
  QUARKUS_MANAGEMENT_PORT: "9000"
  QUARKUS_MANAGEMENT_ROOT_PATH: /q
  QUARKUS_MICROMETER_EXPORT_PROMETHEUS_PATH: metrics
  OTEL_SDK_DISABLED: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy.observability.svc.cluster.local:4317
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "0.1"

  # O RDS recusa conexão sem criptografia. As duas variáveis andam juntas: `require`
  # cifra o transporte, e sem confiar na cadeia o cliente reativo aborta o handshake,
  # porque a CA da AWS não está no truststore da JVM. Isso dispensa embarcar o bundle
  # de CA na imagem — o tráfego não sai da VPC e o banco não é alcançável de fora dela.
  POSTGRES_SSLMODE: require
  POSTGRES_TRUST_ALL: "true"

  QUARKUS_HTTP_PORT: "8080"

  JWT_ISSUER: oficina-api
  JWT_EXPIRATION_HOURS: "8"

  # O par RS256 chega por Secret montado em /etc/jwt. Qualquer caminho diferente do
  # default de desenvolvimento também é o que satisfaz o JwtKeyStartupGuard.
  JWT_PRIVATE_KEY_LOCATION: file:/etc/jwt/privateKey.pem
  JWT_PUBLIC_KEY_LOCATION: file:/etc/jwt/publicKey.pem

  APP_SEED_ADMIN_USERNAME: admin
  APP_SEED_MECHANIC_USERNAME: mecanico

  # Ligado de propósito: este ambiente existe para ser demonstrado e avaliado, e o
  # Swagger UI é a porta de entrada da banca. Num ambiente real vale `false`, como diz
  # o comentário em application.yaml — expor a superfície da API é risco desnecessário.
  SWAGGER_UI_ENABLED: "true"

  # Servidor de e-mail. Host, porta e remetente são configuração; usuário e senha são
  # segredo e chegam pelo Secret oficina-mecanica-env, montado por
  # infra/scripts/create-app-credentials.sh.
  #
  # `MAIL_MOCK: "false"` é o que faz o mailer entregar de verdade: com `true`, que é o
  # default de desenvolvimento, a mensagem só é registrada em log e o cliente nunca
  # recebe o link de decisão do orçamento.
  #
  # O destino é o sandbox do Mailtrap, que captura a mensagem em vez de entregá-la ao
  # endereço do cliente — num ambiente de avaliação é o que se quer, porque o link de
  # decisão pode ser conferido sem enviar e-mail a pessoa alguma. Como nada é entregue
  # de fato, o remetente é livre: nenhum servidor de destino valida o domínio.
  #
  # A porta 2525 é a alternativa que o Mailtrap oferece justamente porque provedores de
  # nuvem costumam bloquear a saída na 25.
  MAIL_MOCK: "false"
  MAIL_FROM: no-reply@oficina-mecanica.com
  MAIL_HOST: sandbox.smtp.mailtrap.io
  MAIL_PORT: "2525"
  MAIL_START_TLS: REQUIRED
