apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-mecanica
spec:
  # O número de réplicas é omitido de propósito: quem manda nele é o HPA de
  # k8s/hpa.yaml. Declará-lo aqui faria cada `kubectl apply` devolver o Deployment ao
  # valor fixo e desfazer a escala em curso. Sem o campo, o Deployment nasce com uma
  # réplica — o que deixa o Flyway migrar sem concorrência no primeiro deploy — e o
  # autoscaler assume a partir daí.
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-mecanica
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-mecanica
    spec:
      # A imagem já declara USER 185; repetir aqui é o que faz o Kubernetes recusar o
      # pod caso alguém publique uma imagem que voltou a rodar como root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        # Os arquivos de um volume de Secret nascem com dono root. Sem fsGroup, o
        # processo em 185 não lê o par RS256 e o SmallRye rejeita a chave dizendo
        # apenas que a localização é inválida.
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: oficina-mecanica
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-mecanica-config
            - secretRef:
                name: oficina-mecanica-env
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Sem requests o HPA não tem base de cálculo: é sobre elas que ele calcula a
          # utilização. O request de memória fica acima do que o pod consome ocioso
          # (cerca de 250Mi), senão a aplicação já nasceria acima do alvo de 80% e o
          # autoscaler manteria réplicas de pé sem carga alguma.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # A JVM leva alguns segundos para subir, e a readiness inclui a checagem do
          # Postgres. O startupProbe dá até 2 minutos para isso sem que a liveness
          # comece a matar o pod no meio da inicialização.
          #
          # O timeout default de um segundo é curto demais para um pod no teto da sua
          # cota de CPU: sob carga o pod ficava intermitentemente não-pronto, saía do
          # balanceador e — pior — sumia da conta do HPA, que ignora pod não-pronto e
          # ficava sem métrica justamente quando precisava escalar.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: jwt-keys
          secret:
            secretName: oficina-mecanica-jwt
            defaultMode: 0440
