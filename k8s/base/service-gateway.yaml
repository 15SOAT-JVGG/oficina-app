apiVersion: v1
kind: Service
metadata:
  name: oficina-mecanica-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: oficina-mecanica
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
