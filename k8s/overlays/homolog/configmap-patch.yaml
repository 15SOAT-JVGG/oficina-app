apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-mecanica-config
data:
  # Endereço do RDS de homologação (output `db_address` do oficina-infra-db, state
  # `homolog`). Muda se a instância for recriada, e o sintoma é um pod que nunca fica
  # pronto: o Flyway não alcança o banco.
  INFRA_HOST_POSTGRES: oficina-homolog.cpeio3bqnmop.us-east-1.rds.amazonaws.com

  # Endereço por onde o cliente alcança a API, e por isso a base dos links de
  # acompanhamento e de decisão do orçamento que saem por e-mail: o API Gateway de
  # homologação (output `api_gateway_urls` do oficina-infra-k8s). Sem barra no fim.
  APP_PUBLIC_BASE_URL: https://tnkxdt6m8h.execute-api.us-east-1.amazonaws.com
